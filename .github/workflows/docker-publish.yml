name: Build and push image

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fwilhe2
          password: ${{ secrets.DH_PAT }}
      - name: Build and push
        run: docker buildx build --platform=linux/amd64,linux/arm64 --push --tag=fwilhe2/toybox .
      - run: docker pull fwilhe2/toybox
      - name: Install container-structure-test
        run: curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/latest/download/container-structure-test-linux-amd64 && chmod +x container-structure-test-linux-amd64 && sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
      - name: Test Image
        run: container-structure-test test --image fwilhe2/toybox --config tests.yaml
